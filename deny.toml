# cargo-deny configuration: `cargo deny check` in CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# The release workflow builds musl targets; keep the audit honest for them.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[advisories]
vulnerability = "deny"
unmaintained = "warn"
unsound = "warn"
ignore = []

[licenses]
unlicensed = "deny"
# Every crate in the tree resolves to at least one of these (checked
# 2026-10-12 via `cargo metadata`).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "LGPL-2.1-or-later",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
