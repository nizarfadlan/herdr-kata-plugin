# cargo-deny configuration: `cargo deny check` in CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# The release workflow builds musl targets; keep the audit honest for them.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[advisories]
# Schema pinned to cargo-deny 0.20: `vulnerability` and `unsound` no longer
# take a level — those advisories now always fail the check (add an entry to
# `ignore` below with a reason if one does not apply). `unmaintained` takes a
# scope, not a level; "none" keeps the old warn-only intent (no failure).
unmaintained = "none"
yanked = "warn"
ignore = []

[licenses]
# cargo-deny 0.20: `unlicensed` was removed — every license not in `allow`
# is denied by default, which is exactly what the old `unlicensed = "deny"`
# expressed.
# Every crate in the tree resolves to at least one of these (checked
# 2026-10-12 via `cargo deny check licenses` on the [graph] targets).
# Unused entries are removed on sight — deny fails closed, so a future
# dependency needing one will say so loudly.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
