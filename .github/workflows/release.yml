name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            use-cross: false
          - target: aarch64-unknown-linux-musl
            use-cross: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches packaged versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          plugin_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml | head -n 1)
          echo "tag=$tag_version cargo=$cargo_version plugin=$plugin_version"
          [ "$tag_version" = "$cargo_version" ] || { echo "tag v$tag_version != Cargo.toml $cargo_version"; exit 1; }
          [ "$tag_version" = "$plugin_version" ] || { echo "tag v$tag_version != herdr-plugin.toml $plugin_version"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: ${{ !matrix.use-cross }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: ${{ matrix.use-cross }}
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Smoke test (native target only)
        if: ${{ !matrix.use-cross }}
        run: |
          expected="herdr-kata ${GITHUB_REF_NAME#v}"
          actual="$(./target/${{ matrix.target }}/release/herdr-kata --version)"
          echo "expected: $expected"
          echo "actual:   $actual"
          [ "$actual" = "$expected" ] || exit 1

      - name: Stage release asset
        run: |
          cp "target/${{ matrix.target }}/release/herdr-kata" \
             "herdr-kata-${GITHUB_REF_NAME#v}-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: herdr-kata-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum herdr-kata-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/herdr-kata-*
            dist/SHA256SUMS
          generate_release_notes: true
